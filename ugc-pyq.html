
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UGC NET PYQs | ExamPrep</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pyq-container {
      max-width: 1050px;
      margin: 50px auto;
      padding: 0 20px;
    }
    .pyq-container h1, .pyq-intro {
      text-align: center;
    }
    .pyq-intro {
      color: #94a3b8;
      margin-bottom: 30px;
    }
    #yearFilter {
      padding: 12px;
      margin-bottom: 25px;
      border-radius: 8px;
    }
    #paperList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .pyq-card {
      background: #111d33;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
    }
    .pyq-card a {
      display: inline-block;
      margin: 10px 8px 0 0;
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <header>
    <h2>ExamPrep</h2>
    <nav>
      <a href="ugc-net.html">UGC NET Dashboard</a>
    </nav>
  </header>

  <main class="pyq-container">
    <h1>UGC NET Previous Year Papers</h1>
    <p class="pyq-intro">
      Computer Science & Applications — Paper 1 and Paper 2
    </p>

    <label for="yearFilter">Select Year:</label>
    <select id="yearFilter">
      <option value="all">All Years</option>
    </select>

    <div id="paperList"></div>
  </main>

  <footer>
    <p>© 2026 ExamPrep | B.Tech CSE Mini Project</p>
  </footer>

  <script src="js/ugc-pyq.js"></script>
</body>
</html>
